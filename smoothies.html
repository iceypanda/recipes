<!DOCTYPE html>
<html lang="en-gb">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width" />
    <link rel="stylesheet" href="food.css" />
    <script src="js/jquery-3.6.0.min.js" type="text/javascript"></script>
    <script src="js/food.js" type="text/javascript"></script>
    <title>Milkshakes &amp; smoothies</title>
</head>

<body>
    <div id="main">

        <h1>Milkshakes &amp; smoothies</h1>

        <h2>Milkshake</h2>
        <ul>
            <li>Ratios
                <ul>
                    <li>2 milk</li>
                    <li>1 ice cream</li>
                    <li>&frac13; fruit</li>
                </ul>
            </li>
        </ul>
        <h3>Mango</h3>
        <ul>
            <li>Blitz
                <ul>
                    <li>300g <em>milk</em></li>
                    <li>150g <em>mango ice cream</em></li>
                    <li>50g <em>frozen mango</em></li>
                </ul>
            </li>
        </ul>

        <h2>Cherry chocolate</h2>
        <ul>
            <li>Blitz
                <ul>
                    <li>230g <em>milk</em></li>
                    <li>1 sachet <em>cherry chocolate powder</em></li>
                    <li>70g <em>frozen cherries</em></li>
                </ul>
            </li>
        </ul>

    </div>
</body>

</html>
