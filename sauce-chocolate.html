    <title>Chocolate sauce</title>

<body>
    <div id="main">

        <h1>Chocolate sauce</h1>

        <ol>
            <li>Heat gently in saucepan, stirring often till smooth
                <ul>
                    <li>220ml <em>double cream</em></li>
                    <li>100g <em>dark chocolate</em></li>
                    <li>1 tbsp <em>honey</em></li>
                    <li>1 tbsp <em>light brown sugar</em></li>
                    <li>pinch <em>salt</em></li>
                </ul>
            </li>
        </ol>

        <h2>Notes</h2>
        <ul>
            <li><a href="https://www.theguardian.com/food/2026/nov/06/steamed-chocolate-puddings-malted-chocolate-sauce-recipe-benjamina-ebuehi"
                    target="_blank">Original recipe</a></li>
        </ul>

    </div>
</body>
